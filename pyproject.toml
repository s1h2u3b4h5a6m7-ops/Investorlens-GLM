[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investorlens"
version = "0.1.0"
description = "InvestorLens — Data-driven research infrastructure for Indian listed companies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "InvestorLens" }]
keywords = ["india", "equities", "research", "knowledge-graph", "value-chain"]

# Pinned, minimal dependency set. Add more only when genuinely needed.
dependencies = [
    "pydantic>=2.6,<3.0",
    "requests>=2.31,<3.0",
    "python-dateutil>=2.9,<3.0",
    "PyYAML>=6.0,<7.0",
    "openjsoncanvas>=3.0,<4.0",
    "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]
graph = [
    "networkx>=3.3,<4.0",
]
io = [
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
]

[project.urls]
Documentation = "https://github.com/investorlens/investorlens"
Repository = "https://github.com/investorlens/investorlens"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests that hit external services (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 110
target-version = "py311"
